<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>심연의 성소 (Abyss Sanctuary)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #0d0d0f; color: #d1d1d6; display: flex; height: 100vh; }
        #sidebar { width: 220px; background-color: #121214; padding: 15px; border-right: 1px solid #222; }
        .tab-btn { background: none; border: none; color: #999; padding: 10px; width: 100%; text-align: left; cursor: pointer; margin-bottom: 5px; }
        .tab-btn:hover, .tab-btn.active { background-color: #2a0b0b; color: #ff4d4d; }
        #main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-page { display: none; }
        .tab-page.active { display: block; }
        .action-btn { background-color: #240b0b; border: 1px solid #ff4d4d; color: #ff9999; padding: 10px 15px; cursor: pointer; font-weight: bold; }
        .log-box { background-color: #111; border: 1px solid #333; padding: 15px; height: 250px; overflow-y: auto; margin-top: 20px; font-size: 13px; color: #aaa; }
        .highlight { color: #ffeb3b; font-weight: bold; }
        .epic { color: #ff1744; font-weight: bold; text-shadow: 0 0 5px red; }
        
        /* 상단 자원 표시 바 */
        .top-bar { padding: 15px 30px; background: #16161a; border-bottom: 2px solid #2a0808; font-weight: bold; font-size: 16px; }
        .res-value { color: #ff4d4d; text-shadow: 0 0 5px rgba(255, 77, 77, 0.4); margin-right: 20px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <button class="tab-btn active" onclick="switchTab('battle')">⚔️ 보스 토벌</button>
        <button class="tab-btn" onclick="switchTab('inventory')">🎒 인벤토리</button>
        <button class="tab-btn" onclick="resetData()" style="margin-top: 50px; color: #777;">⚙️ 데이터 초기화</button>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column;">
        <!-- 상단 자원 -->
        <div class="top-bar">
            영혼: <span id="souls" class="res-value">0</span>
            심연의 파편: <span id="shards" class="res-value">0</span>
        </div>

        <!-- 메인 화면 -->
        <div id="main-content">
            <!-- 토벌 탭 -->
            <div id="tab-battle" class="tab-page active">
                <h2>심연의 보스 토벌</h2>
                <p style="margin: 10px 0; color: #888;">버튼을 누를 때마다 보스를 처치하고 정해진 확률로 전리품을 얻습니다.</p>
                <button class="action-btn" onclick="killBoss()">보스 1회 처치</button>
                <button class="action-btn" onclick="autoFarm(100)">보스 100회 연속 처치 (테스트용)</button>
                
                <div id="battle-log" class="log-box"></div>
            </div>

            <!-- 인벤토리 탭 -->
            <div id="tab-inventory" class="tab-page">
                <h2>내 가방</h2>
                <div id="inv-list" class="log-box">아직 얻은 아이템이 없습니다.</div>
            </div>
        </div>
    </div>

    <!-- 아이템 창고 불러오기 -->
    <script src="items.js"></script>

    <!-- 게임 시스템 뼈대 -->
    <script>
        const DEFAULT_DATA = {
            version: "0.1",
            resources: { souls: 0, shards: 0 },
            stats: { totalKills: 0 },
            inventory: {},
            lastSaveTime: Date.now()
        };

        let player = JSON.parse(JSON.stringify(DEFAULT_DATA));

        const Engine = {
            save: function() {
                player.lastSaveTime = Date.now();
                localStorage.setItem("darkIdleSave", JSON.stringify(player)); 
            },
            load: function() {
                const savedData = localStorage.getItem("darkIdleSave");
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    player = { ...DEFAULT_DATA, ...parsed, resources: { ...DEFAULT_DATA.resources, ...parsed.resources } };
                    Engine.log("데이터를 성공적으로 불러왔습니다.");
                } else {
                    Engine.log("새로운 여정을 시작합니다.");
                }
            },
            wipeData: function() {
                if(confirm("모든 데이터가 영구적으로 삭제됩니다. 정말 초기화하시겠습니까?")) {
                    localStorage.removeItem("darkIdleSave");
                    player = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    UI.updateAll();
                    Engine.log("세계가 초기화되었습니다.");
                }
            },
            log: function(msg) {
                const logBox = document.getElementById('battle-log');
                if(!logBox) return;
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                logBox.innerHTML = `<span style="color:#555;">[${timeStr}]</span> ${msg}<br>` + logBox.innerHTML;
            },
            tick: function() {
                Engine.save();
            }
        };

        const UI = {
            updateResources: function() {
                const elSouls = document.getElementById('souls');
                const elShards = document.getElementById('shards');
                if(elSouls) elSouls.innerText = player.resources.souls;
                if(elShards) elShards.innerText = player.resources.shards;
            },
            updateInventory: function() {
                const invList = document.getElementById('inv-list');
                if(!invList) return;
                invList.innerHTML = "";
                let isEmpty = true;

                for (const itemId in player.inventory) {
                    const itemData = itemDB.find(i => i.id === itemId);
                    if (itemData) {
                        const count = player.inventory[itemId];
                        invList.innerHTML += `<p><strong style="color:#ff8080;">${itemData.name}</strong> x ${count} <br> <span style="font-size:11px; color:#777;">${itemData.desc}</span></p><hr style="border:0.5px solid #333; margin: 10px 0;">`;
                        isEmpty = false;
                    }
                }
                if (isEmpty) invList.innerHTML = "가방이 비어있습니다.";
            },
            updateAll: function() {
                this.updateResources();
                this.updateInventory();
            },
            switchTab: function(tabId) {
                document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                
                document.getElementById('tab-' + tabId).classList.add('active');
                event.currentTarget.classList.add('active');
                
                if(tabId === 'inventory') this.updateInventory();
            }
        };

        const Action = {
            killBoss: function() {
                let dropFound = false;
                itemDB.forEach(item => {
                    const roll = Math.random(); 
                    if (roll <= item.dropRate) {
                        player.inventory[item.id] = (player.inventory[item.id] || 0) + 1;
                        dropFound = true;
                        if(item.dropRate <= 0.001) {
                            Engine.log(`<span class="epic">🔥 기적! [${item.name}] 획득!! (확률: ${item.dropRate * 100}%)</span>`);
                        } else {
                            Engine.log(`<span class="highlight">[${item.name}]</span> 획득.`);
                        }
                    }
                });

                if (!dropFound) Engine.log("보스를 처치했지만 전리품이 없습니다.");
                
                player.stats.totalKills += 1;
                player.resources.souls += 10;
                UI.updateAll();
            },
            autoFarm: function(times) {
                Engine.log(`--- 보스 ${times}회 연속 토벌 시작 ---`);
                for(let i=0; i<times; i++) {
                    this.killBoss();
                }
            }
        };

        function switchTab(tabId) { UI.switchTab(tabId); }
        function killBoss() { Action.killBoss(); }
        function autoFarm(times) { Action.autoFarm(times); }
        function resetData() { Engine.wipeData(); }

        window.onload = function() {
            Engine.load();    
            UI.updateAll();   
            setInterval(function() { Engine.tick(); }, 1000);
        };
    </script>
</body>
</html>
